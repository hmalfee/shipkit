packages:
    - apps/*
    - packages/*
    - tooling/*
catalog:
    '@opentelemetry/api': ^1.9.1
    '@orpc/client': ^1.13.2
    '@orpc/contract': ^1.13.2
    '@orpc/json-schema': ^1.14.3
    '@orpc/openapi': ^1.14.3
    '@orpc/openapi-client': ^1.14.3
    '@orpc/server': ^1.14.3
    '@orpc/tanstack-query': ^1.13.2
    '@orpc/zod': ^1.14.3
    '@tanstack/react-query': ^5.60.5
    '@tanstack/react-query-devtools': ^5.60.5
    # '@polar-sh/better-auth': ^1.8.3
    '@types/react': ^19.2.10
    '@types/react-dom': ^19.2.3
    better-auth: 1.5.5
    dotenv: ^17.2.2
    lucide-react: ^0.546.0
    next: ^16.2.0
    next-themes: ^0.4.6
    react: ^19.2.3
    react-dom: ^19.2.3
    sonner: ^2.0.7
    tailwindcss: ^4.1.18
    typescript: ^6
    zod: ^4.1.13
# Below along with package.json's engines field enforces Node.js version 22 (tsx watch broken on Node 24.12+, see privatenumber/tsx#767)
engineStrict: true
publicHoistPattern:
    - '*eslint*'
    - '*prettier*'
    - '*oxlint*'
allowBuilds:
    better-sqlite3: true
