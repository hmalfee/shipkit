packages:
    - apps/*
    - packages/*
    - tooling/*
catalog:
    # oRPC packages
    '@orpc/client': ^1.13.2
    '@orpc/contract': ^1.13.2
    '@orpc/json-schema': ^1.14.3
    '@orpc/openapi': ^1.14.3
    '@orpc/openapi-client': ^1.14.3
    '@orpc/server': ^1.14.3
    '@orpc/tanstack-query': ^1.13.2
    '@orpc/zod': ^1.14.3

    # Tanstack Query packages
    '@tanstack/react-query': ^5.60.5
    '@tanstack/react-query-devtools': ^5.60.5

    # React packages
    react: ^19.2.3
    react-dom: ^19.2.3
    '@types/react': ^19.2.10
    '@types/react-dom': ^19.2.3

    # BetterAuth packages
    better-auth: 1.6.25
    auth: 1.6.25 # CLI package for better-auth, make sure to keep version in sync with better-auth package

    '@opentelemetry/api': ^1.9.1
    dotenv: ^17.2.2
    lucide-react: ^0.546.0
    next: ^16.2.0
    next-themes: ^0.4.6
    sonner: ^2.0.7
    tailwindcss: ^4.1.18
    typescript: ^6
    zod: ^4.1.13
    tsx: ^4.23.1
# Below along with package.json's engines field enforces Node.js version from package.json
engineStrict: true
publicHoistPattern:
    - '*eslint*'
    - '*prettier*'
    - '*oxlint*'
allowBuilds:
    bcrypt: false
    better-sqlite3: true
    core-js: false
    esbuild: false
    msw: false
    protobufjs: false
    redis-commander: false
    sharp: false
optimisticRepeatInstall: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - '@turbo/*'
preferFrozenLockfile: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
    - semver@6.3.1
    - undici-types@6.21.0
    - chokidar@4.0.3
patchedDependencies:
    '@dokploy/sdk': patches/@dokploy__sdk.patch
