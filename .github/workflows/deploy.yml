name: Deploy to Dokploy via SSH

on:
    workflow_dispatch:
    # DISABLED FOR NOW
    # push:
    #     branches: [main, staging]

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Detect & Deploy Affected Apps
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Fetches all history for all branches and tags

            - name: Read versions from package.json
              id: versions
              run: |
                  echo "node=$(jq -r '.engines.node | split(".")[0]' package.json)" >> $GITHUB_OUTPUT
                  echo "pnpm=$(jq -r '.packageManager | split("@")[1]' package.json)" >> $GITHUB_OUTPUT
                  echo "turbo=$(jq -r '.devDependencies.turbo' package.json)" >> $GITHUB_OUTPUT

            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ steps.versions.outputs.pnpm }}

            - name: Configure pnpm store
              run: pnpm config set store-dir ~/.local/share/pnpm/store

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.versions.outputs.node }}
                  cache: pnpm

            - name: Install dependencies
              run: >
                  pnpm install
                  --filter shipkit... 
                  --filter @shipkit/db... 
                  --frozen-lockfile 
                  --ignore-scripts 
                  --config.trustLockfile=true 
                  --config.audit=false 
                  --network-concurrency=64

            - name: Detect affected apps
              id: detect
              run: |
                  set -e
                  if [ -n "$AFFECTED_APPS_OVERRIDE" ]; then
                      echo "Using override: $AFFECTED_APPS_OVERRIDE"
                      AFFECTED_APPS="$AFFECTED_APPS_OVERRIDE"
                  else
                      # turbo ls --affected does not allow --filter, so we filter by path in jq
                      AFFECTED_APPS=$(pnpm dlx turbo@${{ steps.versions.outputs.turbo }} ls --affected --output=json 2>/dev/null | sed -n '/^{/,$p' | jq -r '.packages.items[] | select(.path | startswith("apps/")) | .name' | xargs | tr ' ' ',')
                  fi
                  echo "affected_apps=$AFFECTED_APPS" >> "$GITHUB_OUTPUT"
                  echo "Affected apps: $AFFECTED_APPS"

            # Validates the required secrets and exports them to $GITHUB_ENV so
            # every later step can read them.
            - name: Validate & export required secrets
              if: steps.detect.outputs.affected_apps != ''
              env:
                  SECRETS_JSON: ${{ toJSON(secrets) }}
              run: |
                  required=(
                      SSH_KEY
                      SSH_HOST
                      DOKPLOY_API_KEY
                      BASE_DOMAIN
                  )

                  missing=()
                  for var in "${required[@]}"; do
                      value=$(jq -r --arg k "$var" '.[$k] // ""' <<< "$SECRETS_JSON")
                      if [ -z "$value" ]; then
                          missing+=("$var")
                      fi
                  done
                  if [ ${#missing[@]} -gt 0 ]; then
                      echo "::error::Missing required secrets: ${missing[*]}"
                      exit 1
                  fi

                  # Heredoc syntax is needed because SSH_KEY can be multi-line.
                  # The random delimiter prevents a secret from ending the block early.
                  delim="EOF_$(openssl rand -hex 8)"
                  for var in "${required[@]}"; do
                      value=$(jq -r --arg k "$var" '.[$k]' <<< "$SECRETS_JSON")
                      printf '%s<<%s\n%s\n%s\n' "$var" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
                  done

            - name: Setup SSH key & tunnel to Dokploy and Registry
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  mkdir -p ~/.ssh
                  if echo "$SSH_KEY" | grep -q "BEGIN"; then
                      echo "$SSH_KEY" > ~/.ssh/dokploy_ci
                  else
                      echo "$SSH_KEY" | base64 -d > ~/.ssh/dokploy_ci
                  fi
                  chmod 600 ~/.ssh/dokploy_ci
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                  ssh -4 -fNMS /tmp/dokploy_ssh.sock \
                      -L 127.0.0.1:3000:localhost:3000 \
                      -L 127.0.0.1:5000:localhost:5000 \
                      -i ~/.ssh/dokploy_ci \
                      "root@$SSH_HOST"
                  sleep 1

                  # `dokploy` CLI script requires DOKPLOY_URL to be present.
                  echo "DOKPLOY_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

            - name: Ensure project
              if: steps.detect.outputs.affected_apps != ''
              run: DOKPLOY_GENERATED=/tmp/dokploy_generated.env pnpm exec dokploy ensure-project

            - name: Ensure databases
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  PROJECT_ID=$(grep "^DOKPLOY_PROJECT_ID=" /tmp/dokploy_generated.env | cut -d= -f2-)
                  DOKPLOY_GENERATED=/tmp/dokploy_generated.env pnpm exec dokploy ensure-db --project "$PROJECT_ID" --postgres --redis

            - name: Run postgres tunnel & migrations
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  # Source the generated vars so they are in process.env for Node
                  set -a
                  source /tmp/dokploy_generated.env
                  set +a

                  node .github/scripts/pg-tunnel-migrate.mjs

            - name: Ensure Apps
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  PROJECT_ID=$(grep "^DOKPLOY_PROJECT_ID=" /tmp/dokploy_generated.env | cut -d= -f2-)
                  DOKPLOY_GENERATED=/tmp/dokploy_generated.env pnpm exec dokploy ensure-apps --project "$PROJECT_ID" --base-domain "$BASE_DOMAIN"

            - name: Consolidate environment
              if: steps.detect.outputs.affected_apps != ''
              env:
                  SECRETS_JSON: ${{ toJSON(secrets) }}
              run: |
                  echo "$SECRETS_JSON" | jq -r '
                      to_entries[]
                      | select(.key | test("^(GITHUB_TOKEN|SSH_|DOKPLOY_|REGISTRY_)"; "i") | not)
                      | "\(.key)=\(.value)"
                  ' >> /tmp/dokploy_generated.env

            - name: Build and Push Docker Images
              id: build
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  IFS=',' read -ra APPS <<< "${{ steps.detect.outputs.affected_apps }}"

                  # Push (this runner's daemon, via the tunnel) and pull
                  # (Dokploy's host) both see the registry at 127.0.0.1:5000.
                  REG_HOST="127.0.0.1:5000"

                  APPS_BUILT=""

                  for app in "${APPS[@]}"; do
                      echo "Building $app..."

                      APP_ID_VAR="APP_ID_$(echo "$app" | tr '[:lower:]-' '[:upper:]_')"
                      APP_ID=$(grep "^${APP_ID_VAR}=" /tmp/dokploy_generated.env | cut -d= -f2-)

                      TAG="${{ github.sha }}-${{ github.ref_name }}"
                      PUSH_IMAGE="${REG_HOST}/shipkit/${app}:${TAG}"
                      CACHE_REF="${REG_HOST}/shipkit/${app}:buildcache-${{ github.ref_name }}"
                      
                      pnpm exec docker-build "$app" \
                          --build-env-file=/tmp/dokploy_generated.env \
                          --cache-ref="${CACHE_REF}"

                      docker tag "$app" "$PUSH_IMAGE"
                      docker push "$PUSH_IMAGE"
                      
                      APPS_BUILT="${APPS_BUILT}${app}:${APP_ID}:${PUSH_IMAGE},"
                  done

                  echo "apps_built=${APPS_BUILT%,}" >> "$GITHUB_OUTPUT"

            - name: Deploy to Dokploy
              if: steps.detect.outputs.affected_apps != ''
              run: |
                  IFS=',' read -ra BUILT <<< "${{ steps.build.outputs.apps_built }}"
                  for entry in "${BUILT[@]}"; do
                      APP_NAME="$(echo "$entry" | cut -d: -f1)"
                      APP_ID="$(echo "$entry" | cut -d: -f2)"
                      IMAGE="$(echo "$entry" | cut -d: -f3-)"
                      echo "Deploying app $APP_NAME (ID: $APP_ID)..."
                      pnpm exec dokploy deploy \
                          --app-id "$APP_ID" \
                          --image "$IMAGE" \
                          --env-file /tmp/dokploy_generated.env
                  done

            - name: Close all tunnels
              if: always()
              run: ssh -S /tmp/dokploy_ssh.sock -O exit placeholder || true
