name: Stop Staging on Merge to Main
on:
    workflow_dispatch:
    # DISABLED FOR NOW
    # pull_request:
    #     types: [closed]
    #     branches: [main]
concurrency:
    group: staging-teardown
    cancel-in-progress: false
jobs:
    teardown:
        name: Stop Staging Environment
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'staging')
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Read versions from package.json
              id: versions
              run: |
                  echo "name=$(jq -r '.name' package.json)" >> $GITHUB_OUTPUT
                  echo "node=$(jq -r '.engines.node | split(".")[0]' package.json)" >> $GITHUB_OUTPUT
                  echo "pnpm=$(jq -r '.packageManager | split("@")[1]' package.json)" >> $GITHUB_OUTPUT

            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ steps.versions.outputs.pnpm }}

            - name: Configure pnpm store
              run: pnpm config set store-dir ~/.local/share/pnpm/store

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ steps.versions.outputs.node }}
                  cache: pnpm

            - name: Install dependencies
              run: >
                  pnpm install
                  --filter shipkit... 
                  --filter @shipkit/db... 
                  --frozen-lockfile 
                  --ignore-scripts 
                  --config.trustLockfile=true 
                  --config.audit=false 
                  --network-concurrency=64

            # Validates the required secrets and exports them to $GITHUB_ENV so
            # every later step can read them.
            - name: Validate & export required secrets
              env:
                  SECRETS_JSON: ${{ toJSON(secrets) }}
              run: |
                  required=(
                      SSH_KEY
                      SSH_HOST
                      DOKPLOY_API_KEY
                  )

                  missing=()
                  for var in "${required[@]}"; do
                      value=$(jq -r --arg k "$var" '.[$k] // ""' <<< "$SECRETS_JSON")
                      if [ -z "$value" ]; then
                          missing+=("$var")
                      fi
                  done
                  if [ ${#missing[@]} -gt 0 ]; then
                      echo "::error::Missing required secrets: ${missing[*]}"
                      exit 1
                  fi

                  # Heredoc syntax is needed because SSH_KEY can be multi-line.
                  # The random delimiter prevents a secret from ending the block early.
                  delim="EOF_$(openssl rand -hex 8)"
                  for var in "${required[@]}"; do
                      value=$(jq -r --arg k "$var" '.[$k]' <<< "$SECRETS_JSON")
                      printf '%s<<%s\n%s\n%s\n' "$var" "$delim" "$value" "$delim" >> "$GITHUB_ENV"
                  done

            - name: Setup SSH key & tunnel to Dokploy
              run: |
                  mkdir -p ~/.ssh
                  if echo "$SSH_KEY" | grep -q "BEGIN"; then
                      echo "$SSH_KEY" > ~/.ssh/dokploy_ci
                  else
                      echo "$SSH_KEY" | base64 -d > ~/.ssh/dokploy_ci
                  fi
                  chmod 600 ~/.ssh/dokploy_ci
                  ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
                  ssh -4 -fNMS /tmp/dokploy_ssh.sock \
                      -L 127.0.0.1:3000:localhost:3000 \
                      -i ~/.ssh/dokploy_ci \
                      "root@$SSH_HOST"
                  sleep 1

                  # `dokploy` CLI script requires DOKPLOY_URL to be present.
                  echo "DOKPLOY_URL=http://127.0.0.1:3000" >> "$GITHUB_ENV"

            - name: Find staging project and stop
              run: |
                  export DOKPLOY_GENERATED=/tmp/dokploy_generated.env
                  pnpm exec dokploy ensure-project --name "${{ steps.versions.outputs.name }}" --staging
                  PROJECT_ID=$(grep "^DOKPLOY_PROJECT_ID=" "$DOKPLOY_GENERATED" | cut -d= -f2)
                  pnpm exec dokploy stop-project --project "$PROJECT_ID" --staging

            - name: Close all tunnels
              if: always()
              run: ssh -S /tmp/dokploy_ssh.sock -O exit placeholder || true
